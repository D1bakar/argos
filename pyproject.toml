[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argos-scanner"
version = "0.1.0"
description = "argos — active web application vulnerability scanner for authorized security testing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "D1bakar" }]
keywords = ["security", "vulnerability-scanner", "pentest", "owasp", "appsec"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "httpx[http2]>=0.27",
    "beautifulsoup4>=4.12",
    "typer>=0.12",
    "rich>=13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
argos = "argos.cli:app"

[project.urls]
Homepage = "https://github.com/D1bakar/argos"
Repository = "https://github.com/D1bakar/argos"

[tool.hatch.build.targets.wheel]
packages = ["argos"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer/fastapi declare options as function-call defaults by design
"argos/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
